name: Generar Boletin ISFAS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Ejecutar script de noticias
      run: python noticias_isfas_informe14.py

    - name: Organizar informe generado en la carpeta informes
      run: |
        mkdir -p informes
        mv Informe_Sanidad_Interactivo_*.html informes/ || true

    - name: Guardar cambios y actualizar historial JSON en GitHub
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "🤖 Actualización automática de noticias e historial JSON"
        branch: main
